services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: analyses
      POSTGRES_USER: analyses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
