name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        if: runner.os != 'Windows'
        run: ./gradlew build --warning-mode all
      - name: Build Windows artifacts and non-database tests
        if: runner.os == 'Windows'
        run: .\gradlew.bat :libs:core:build :apps:cli:build :apps:api:assemble :apps:api:compileTestJava --warning-mode all
